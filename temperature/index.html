<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>온도조절 민원 (프로토타입)</title>
<link rel="stylesheet" href="../assets/style.css">
</head>
<body>
<header class="topbar"><div class="inner"><a class="back" id="backLink" href="../index.html" aria-label="뒤로">‹</a><h1>온도조절</h1></div></header>

<main class="wrap">
  <div class="carbadge">
    <span class="dot"></span>
    <div><b id="carText"></b><small>지금 타고 있는 칸으로 접수돼요</small></div>
  </div>

  <!-- 1단계: 온도 확인 + 더워요/추워요 바로 전송 -->
  <section class="step on" id="s1">
    <div class="temps">
      <div class="temp now">
        <div class="k">현재 온도</div>
        <div class="v"><span id="nowTemp"></span><small>°C</small></div>
        <div class="m">지금 이 칸의 온도</div>
      </div>
      <div class="temp rec">
        <div class="k">겨울철 권장 난방 온도</div>
        <div class="v"><span id="recTemp"></span><small>°C</small></div>
        <div class="m">지하철 객실 기준</div>
      </div>
    </div>

    <p class="lead">지금 칸이 어떤가요?</p>
    <p class="desc">누르면 바로 접수돼요.</p>
    <div class="choice">
      <button class="hot" data-v="hot"><span class="emo" aria-hidden="true">🥵</span><span><b>더워요</b><small>난방을 약하게 해주세요</small></span></button>
      <button class="cold" data-v="cold"><span class="emo" aria-hidden="true">🥶</span><span><b>추워요</b><small>난방을 더 세게 해주세요</small></span></button>
    </div>
  </section>

  <!-- 2단계: 접수 완료 + 처리 상태 -->
  <section class="step" id="s3">
    <div class="done-icon"><svg width="36" height="36" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" stroke="#1f9d61" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    <p class="lead center" style="margin-top:8px">접수되었어요</p>
    <p class="desc center" id="doneDesc"></p>
    <div class="card">
      <ul class="timeline" id="timeline"></ul>
    </div>
    <div class="card" style="font-size:14px;color:var(--sub);line-height:1.6">
      <table class="summary">
        <tr><th>접수번호</th><td id="ticket"></td></tr>
        <tr><th>접수 시각</th><td id="time"></td></tr>
      </table>
      <p style="margin:10px 0 0">같은 칸의 온도 민원은 5분에 한 번만 접수할 수 있어요.</p>
    </div>
    <a class="btn ghost" id="homeLink" href="../index.html" style="margin-top:12px">처음으로</a>
  </section>

  <!-- 중복 접수 제한 -->
  <section class="step" id="sWait">
    <p class="lead">이미 접수된 민원이 있어요</p>
    <p class="desc" id="waitDesc"></p>
    <a class="btn primary" id="homeLink2" href="../index.html" style="margin-top:20px">처음으로</a>
  </section>

  <p class="footer">HCI 6조 프로토타입 · 실제 민원은 접수되지 않습니다</p>
</main>

<script src="../assets/app.js"></script>
<script>
  const { car, key } = getParams();
  // QR 키가 맞지 않으면 첫 화면(차단 화면)으로 돌려보냄
  if (!verifyQr(car, key)) location.replace('../index.html');

  const info = CARS[car] || { line: '' };
  const carLabel = `${info.line} ${car}호차`;
  const home = '../index.html' + (CARS[car] ? qs(car) : '');
  document.getElementById('carText').textContent = carLabel;
  ['backLink', 'homeLink', 'homeLink2'].forEach(id => document.getElementById(id).href = home);

  const LABEL = { hot: '더워요 (난방 약하게)', cold: '추워요 (난방 강하게)' };
  const COOLDOWN = 5 * 60 * 1000;
  document.getElementById('nowTemp').textContent = info.temp != null ? info.temp.toFixed(1) : '-';
  document.getElementById('recTemp').textContent = RECOMMENDED_WINTER;

  function go(id) {
    document.querySelectorAll('.step').forEach(s => s.classList.toggle('on', s.id === id));
    window.scrollTo(0, 0);
  }

  // 같은 칸 중복 접수 확인 (5분)
  const last = store.get('last_' + car);
  if (last && Date.now() - last.at < COOLDOWN) {
    const left = Math.ceil((COOLDOWN - (Date.now() - last.at)) / 60000);
    document.getElementById('waitDesc').textContent =
      `${new Date(last.at).toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' })}에 접수한 '${LABEL[last.v]}' 민원이 처리 중이에요. 약 ${left}분 뒤에 다시 접수할 수 있어요.`;
    go('sWait');
  }

  document.querySelectorAll('.choice button').forEach(b => b.addEventListener('click', () => submit(b.dataset.v)));

  function submit(choice) {
    const now = new Date();
    const hm = now.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });
    const ticket = 'T' + now.toISOString().slice(2, 10).replace(/-/g, '') + '-' + String(Math.floor(Math.random() * 9000) + 1000);
    document.getElementById('ticket').textContent = ticket;
    document.getElementById('time').textContent = now.toLocaleString('ko-KR');
    document.getElementById('doneDesc').textContent = `${carLabel} · ${LABEL[choice]}`;
    // 모의 처리 상태 (실제 처리 결과는 범위 외)
    document.getElementById('timeline').innerHTML = `
      <li class="ok">민원 접수 완료<small>${hm}</small></li>
      <li class="ok">기관사에게 전달됨<small>해당 열차 기관사가 확인합니다</small></li>
      <li>온도 조정 검토 중<small>보통 몇 분 안에 조치되며, 혼잡도·적정온도 기준에 따라 달라질 수 있어요</small></li>`;
    store.set('last_' + car, { at: now.getTime(), v: choice });
    go('s3');
  }
</script>
</body>
</html>
